# Release workflow template for a PRIVATE fylr plugin.
#
# Copy to .github/workflows/release.yaml and generate a fresh ZIP_HASH
# (uuidgen). A private repo's release assets are not fetchable by fylr, so the
# zip is additionally published to GitHub Pages under unguessable URLs:
#
#   https://<org>.github.io/<repo>/<repo>-<ZIP_HASH>-latest.zip
#   https://<org>.github.io/<repo>/<repo>-<ZIP_HASH>-prerelease.zip
#
# -latest.zip is what gets pasted into fylr / the marketplace source; it
# always serves the latest real release. -prerelease.zip serves the newest
# published release, prerelease or not: developers install it to test a
# prerelease (the "plugin prerelease url" column of the plugins sheet).
# Repo settings: Pages > Source = GitHub Actions, and Environments >
# github-pages needs the deployment tag rule v*.*.* (Pages creates it allowing
# the default branch only).
#
# Sealed plugin? Replace "make zip" with "make seal" and ship
# build/<repo>_sealed.zip — a leaked URL then still yields nothing without
# fylr's private key (see fylr-plugin-example-licensed for the live pattern).
name: Release

on:
  release:
    types:
      - published
      - edited

env:
  # unguessable, stable per repo — generate with uuidgen, do NOT copy this one
  ZIP_HASH: 00000000-0000-0000-0000-000000000000

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # drop the node/coffee steps if the plugin has no CoffeeScript;
      # add "npm install -g sass" if it has SCSS
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install CoffeeScript
        run: sudo npm install -g coffeescript@1.12.7

      - name: Install golang
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          # a plugin repo has no go.mod for the dependency cache to key on
          cache: false

      # only for Python packages (build.yml server.python), which the build
      # resolves with uv; drop it otherwise
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Build and package
        run: make zip
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Attach plugin zip to the release
        uses: softprops/action-gh-release@v3
        with:
          # fylr-build-plugin names the zip after the plugin, not after the
          # repository, and the two are not always the same. Attaching the
          # glob keeps the workflow out of the naming rule.
          files: |
            build/*.zip

      # A Pages deploy replaces the whole site, so a prerelease puts the latest
      # real release back as -latest.zip, downloaded unchanged from that
      # release: a rebuild would change the sha256 the marketplace pins.
      - name: Prepare GitHub Pages upload (unguessable filenames)
        run: |
          mkdir -p public
          cp build/${{ github.event.repository.name }}.zip \
             public/${{ github.event.repository.name }}-${{ env.ZIP_HASH }}-prerelease.zip
          if [ "$PRERELEASE" != true ]; then
            cp build/${{ github.event.repository.name }}.zip \
               public/${{ github.event.repository.name }}-${{ env.ZIP_HASH }}-latest.zip
            exit 0
          fi
          latest=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [ -z "$latest" ]; then
            echo "::notice::no real release yet, Pages serves only the prerelease"
            exit 0
          fi
          gh release download "$latest" -R "$GITHUB_REPOSITORY" \
            --pattern ${{ github.event.repository.name }}.zip \
            --output public/${{ github.event.repository.name }}-${{ env.ZIP_HASH }}-latest.zip
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
          GH_TOKEN: ${{ github.token }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Show the prerelease url
        run: |
          echo "prerelease url: ${PAGE_URL%/}/${{ github.event.repository.name }}-${{ env.ZIP_HASH }}-prerelease.zip" \
            >> "$GITHUB_STEP_SUMMARY"
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}

  # Tell the fylr Plugin Marketplace about the release once the zip is
  # reachable, so the catalog lists its tag, date and sha256 within minutes.
  # FYLR_BOT_PERSONAL_ACCESS_TOKEN is a programmfabrik organization secret;
  # elsewhere it is empty and notify-release only prints a notice.
  marketplace:
    if: "!github.event.release.prerelease"
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Install golang
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: false

      - name: Notify the marketplace
        run: go run github.com/programmfabrik/fylr-build-plugin@latest notify-release -repo "$GITHUB_REPOSITORY" -tag "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ secrets.FYLR_BOT_PERSONAL_ACCESS_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
