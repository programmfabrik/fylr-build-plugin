# Release workflow template for a PRIVATE fylr plugin.
#
# Copy to .github/workflows/release.yaml and generate a fresh ZIP_HASH
# (uuidgen). A private repo's release assets are not fetchable by fylr, so the
# zip is additionally published to GitHub Pages under an unguessable URL:
#
#   https://<org>.github.io/<repo>/<repo>-<ZIP_HASH>-latest.zip
#
# That Pages URL is what gets pasted into fylr / the marketplace source. Pages
# deployment is skipped for prereleases, so the URL always serves the latest
# real release. Repo settings: Pages > Source = GitHub Actions.
#
# Sealed plugin? Replace "make zip" with "make seal" and ship
# build/<repo>_sealed.zip — a leaked URL then still yields nothing without
# fylr's private key (see fylr-plugin-example-licensed for the live pattern).
name: Release

on:
  release:
    types:
      - published
      - edited

env:
  # unguessable, stable per repo — generate with uuidgen, do NOT copy this one
  ZIP_HASH: 00000000-0000-0000-0000-000000000000

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # drop the node/coffee steps if the plugin has no CoffeeScript;
      # add "npm install -g sass" if it has SCSS
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install CoffeeScript
        run: sudo npm install -g coffeescript@1.12.7

      - name: Install golang
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          # a plugin repo has no go.mod for the dependency cache to key on
          cache: false

      - name: Build and package
        run: make zip
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Attach plugin zip to the release
        uses: softprops/action-gh-release@v3
        with:
          # fylr-build-plugin names the zip after the plugin, not after the
          # repository, and the two are not always the same. Attaching the
          # glob keeps the workflow out of the naming rule.
          files: |
            build/*.zip

      - name: Prepare GitHub Pages upload (unguessable filename)
        run: |
          mkdir -p public
          cp build/${{ github.event.repository.name }}.zip \
             public/${{ github.event.repository.name }}-${{ env.ZIP_HASH }}-latest.zip

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: "!github.event.release.prerelease"
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
